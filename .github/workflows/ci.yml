name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLISH_IMAGE: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Build, test and verify 80% coverage
        run: ./gradlew build jacocoTestReport jacocoTestCoverageVerification --no-daemon

      - name: Add coverage to job summary
        if: always()
        run: |
          REPORT="build/reports/jacoco/test/jacocoTestReport.csv"
          if [ ! -f "$REPORT" ]; then
            echo "### Code coverage" >> "$GITHUB_STEP_SUMMARY"
            echo "JaCoCo report was not generated." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          awk -F, '
            NR > 1 {
              missed += $8
              covered += $9
            }
            END {
              total = missed + covered
              percentage = total > 0 ? (covered * 100 / total) : 0
              print "### Code coverage"
              printf "**Line coverage: %.2f%%** (required: 80%%)\n", percentage
            }
          ' "$REPORT" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-${{ github.event.repository.name }}
          path: build/reports/jacoco/test/html
          if-no-files-found: warn
          retention-days: 7

      - name: Configure AWS credentials
        if: env.PUBLISH_IMAGE == 'true'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Set image tag
        id: image
        run: |
          if [ "$PUBLISH_IMAGE" = "true" ]; then
            AWS_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
            IMAGE="${AWS_ACCOUNT_ID}.dkr.ecr.${{ vars.AWS_REGION || 'us-east-1' }}.amazonaws.com/fiapx/video-worker-api:${GITHUB_SHA}"
          else
            IMAGE="video-worker-api:${GITHUB_SHA}"
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Build container image
        run: docker build --tag "${{ steps.image.outputs.image }}" .

      - name: Verify runtime image
        run: |
          docker run --rm --entrypoint sh "${{ steps.image.outputs.image }}" \
            -c 'test "$(id -u)" -ne 0 && ffmpeg -version'

      - name: Log in to ECR
        if: env.PUBLISH_IMAGE == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check immutable image
        if: env.PUBLISH_IMAGE == 'true'
        id: ecr
        run: |
          if aws ecr describe-images --repository-name fiapx/video-worker-api --image-ids "imageTag=$GITHUB_SHA" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push container image
        if: env.PUBLISH_IMAGE == 'true' && steps.ecr.outputs.exists != 'true'
        run: docker push "${{ steps.image.outputs.image }}"
