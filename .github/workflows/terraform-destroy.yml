name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Digite DESTROY para remover a aplicação"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-video-worker-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_image_tag: destroy
  TF_VAR_s3_access_key: ${{ secrets.S3_ACCESS_KEY }}
  TF_VAR_s3_secret_key: ${{ secrets.S3_SECRET_KEY }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  destroy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v4
      - run: test "${{ inputs.confirmation }}" = "DESTROY"
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Resolve shared backend
        run: |
          AWS_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          if [ -z "$TF_STATE_BUCKET" ]; then
            TF_STATE_BUCKET="fiap-hackathon-tfstate-${AWS_ACCOUNT_ID}-${AWS_REGION}"
          fi
          echo "TF_STATE_BUCKET=$TF_STATE_BUCKET" >> "$GITHUB_ENV"
          echo "TF_VAR_state_bucket=$TF_STATE_BUCKET" >> "$GITHUB_ENV"
          echo "TF_VAR_aws_region=$AWS_REGION" >> "$GITHUB_ENV"
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ">=1.10.0,<2.0.0"
          terraform_wrapper: false
      - run: terraform init -reconfigure -input=false -backend-config="bucket=$TF_STATE_BUCKET"
      - run: terraform plan -destroy -input=false -out=destroy.tfplan
      - run: terraform apply -input=false -auto-approve destroy.tfplan
